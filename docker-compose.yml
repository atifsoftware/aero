version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aero_app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-secret123}
      - DB_NAME=${DB_NAME:-aero_erp_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SLOW_QUERY_THRESHOLD_MS=${SLOW_QUERY_THRESHOLD_MS:-100}
      - SESSION_SECRET=${SESSION_SECRET:-09191c2e3b4b5b7aea5b49c38ca9c174bc8fe36d07e34bfda6bf342aedad3fb2}
      - JWT_SECRET=${JWT_SECRET:-f7b00dbd941e6fe618b29e6b85b9392d69db17221cbfd6fcc520f3cd79456e72}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/backend/storage/logs:/app/apps/backend/storage/logs
      - ./apps/backend/storage/cache:/app/apps/backend/storage/cache
      - ./apps/backend/public/uploads:/app/apps/backend/public/uploads

  db:
    image: mysql:8.0
    container_name: aero_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-secret123}
      MYSQL_DATABASE: ${DB_NAME:-aero_erp_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-secret123}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: aero_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: aero_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-secret123}
    depends_on:
      - db

volumes:
  mysql_data:
  redis_data:
